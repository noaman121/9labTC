frr version 9.1
frr defaults traditional
hostname leaf2
log stdout
!
vrf TENANT-A
 vni 4000
exit-vrf
!
interface lo
 ip address 10.0.0.2/32
!
interface eth1
 ip address 10.1.2.1/31
 ip ospf network point-to-point
!
interface br20
 ip address 10.0.20.1/24
!
router ospf
 ospf router-id 10.0.0.2
 network 10.0.0.2/32 area 0
 network 10.1.2.1/31 area 0
!
router bgp 65000
 bgp router-id 10.0.0.2
 no bgp default ipv4-unicast
 neighbor 10.0.0.100 remote-as 65000
 neighbor 10.0.0.100 update-source lo
 !
 address-family l2vpn evpn
  neighbor 10.0.0.100 activate
  advertise-all-vni
 exit-address-family
!
router bgp 65000 vrf TENANT-A
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  route-target import 65000:4000
  route-target export 65000:4000
  ! ↑ ここを 65000:40000 に変更すると作問シナリオのRT不一致バグを再現できる
 exit-address-family
!
line vty
!
